<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Redirect GitHub Pages deep links to the Blazor entry point.
        var redirectTo = '/TrustRegistryWebApp/index.html' + location.search + location.hash;
        var path = location.pathname.replace('/TrustRegistryWebApp', '');
        if (path && path !== '/index.html') {
            redirectTo += (redirectTo.includes('?') ? '&' : '?') + 'path=' + encodeURIComponent(path);
        }
        window.location.replace(redirectTo);
    </script>
</head>
<body></body>
</html>
